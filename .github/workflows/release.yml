name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Assemble release APK
        run: chmod +x ./gradlew && ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Sign release APK
        run: |
          set -euo pipefail
          unsigned="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "${unsigned}" ]; then
            echo "No release APK was produced" >&2
            exit 1
          fi
          mkdir -p dist
          keystore="${RUNNER_TEMP}/release.keystore"
          storepass="$(openssl rand -base64 24)"
          keytool -genkeypair -keystore "${keystore}" \
            -storepass "${storepass}" -keypass "${storepass}" \
            -alias tvvideo -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HomeTV, OU=tv-video, O=tv-video, C=US"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          apksigner="${sdk_root}/build-tools/34.0.0/apksigner"
          out="dist/tvvideo-${GITHUB_REF_NAME}.apk"
          "${apksigner}" sign \
            --ks "${keystore}" \
            --ks-pass "pass:${storepass}" \
            --key-pass "pass:${storepass}" \
            --ks-key-alias tvvideo \
            --out "${out}" \
            "${unsigned}"
          "${apksigner}" verify --verbose "${out}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 家庭影视 ${{ github.ref_name }}
          body: |
            家庭影视 v1.0.0 首个开源版本，支持直播电视、NAS家庭影院（SMB/WebDAV/Jellyfin）。
          files: dist/*.apk
          fail_on_unmatched_files: true
